---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: demo-new
  name: demo-dynamic-app
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: dynamic-auth
  namespace: demo-new
spec:
  method: kubernetes
  mount: demo-auth-mount
  kubernetes:
    role: auth-role
    serviceAccount: demo-dynamic-app
    audiences:
      - vault